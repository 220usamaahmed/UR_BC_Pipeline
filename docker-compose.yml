services:
  ur_sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros2_ur3e
    platform: linux/amd64
    container_name: ur3e_sim
    ports:
      # Foxglove Bridge websocket
      - "8765:8765"
    volumes:
      # Your ROS 2 workspace. Write nodes here on the host, run them in the container.
      - ./ros2_ws:/root/ros2_ws
      # External drive (optional, mounted only if it exists)
      - ${EXTERNAL_DRIVE_PATH:+${EXTERNAL_DRIVE_PATH}:/data/external}
    environment:
      # Keep every ROS 2 node in this stack on an isolated DDS domain. Override
      # with ROS_DOMAIN_ID=<id> when intentionally connecting another system.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      - ROBOT_IP=192.168.56.101
      - USE_FAKE_HARDWARE=true
    # Bring up the UR3e mock hardware and the Foxglove bridge automatically.
    command: ["/entrypoint.sh"]
    # Keep stdin/tty so you can also attach for debugging if needed.
    stdin_open: true
    tty: true
