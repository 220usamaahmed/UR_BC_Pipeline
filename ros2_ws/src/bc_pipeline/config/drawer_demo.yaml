# ─────────────────────────────────────────────────────────────────────────────
# Drawer demo — one self-contained experiment definition.
#
# A single config drives every node: the sequence_runner, the scene_publisher,
# and the bag recorder (via the launch file).  Run with:
#
#   ros2 launch bc_pipeline record_sequence.launch.py config:=drawer_demo.yaml
#
# (UR driver + MoveIt + Foxglove must already be running.)
# ─────────────────────────────────────────────────────────────────────────────

robot:
  planning_group: ur_manipulator
  eef_link: tool0
  base_frame: base_link
  joint_names:
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    - shoulder_pan_joint

planning:
  velocity_scaling: 0.2
  accel_scaling: 0.5
  planning_time: 5.0

# Named joint positions, reused by Checkpoint steps. Each list has one value per
# robot.joint_names (6 here). Values are in DEGREES; the config loader converts
# them to radians for the controller.
checkpoints:
  home: [-90.00, 0.00, -90.00, 0.00, 90.00, -0.00]
  approach: [-108.18, -107.64, -150.28, -5.93, 94.92, -7.26]

# The ordered sequence to execute. Steps run top-to-bottom; the first failure
# aborts the run (non-zero exit) so the bag can be discarded.
steps:
  - type: Checkpoint
    checkpoint: home

  - type: Checkpoint
    checkpoint: approach
    # cartesian_offset:
    #   direction: [-1, 0, 0] # base_frame vector (need not be unit; normalised)
    #   distance: 0.1 # metres

  # Pull: slide 10 cm along −Z of the tool (drawer pull), orientation locked.
  - type: OrientationLockCheckpoint
    frame: tool
    axis: [0, 0, 1]
    distance: 0.14

  - type: Wait
    duration: 1.0

  - type: Gripper
    action: grip

  - type: Wait
    duration: 0.2

  - type: Gripper
    action: release

  # Push back: reverse the pull.
  - type: OrientationLockCheckpoint
    frame: tool
    axis: [0, 0, -1]
    distance: 0.10

  - type: Gripper
    action: blow

  - type: OrientationLockCheckpoint
    frame: tool
    axis: [0, 0, -1]
    distance: 0.04

  - type: Checkpoint
    checkpoint: home

# Collision geometry: added to MoveIt's planning scene AND shown in Foxglove.
# size/position are full side lengths and the box centre, in robot.base_frame.
# color (r,g,b,a) affects Foxglove markers only.
obstacles:
  - id: table
    size: [1.2, 1.2, 0.02]
    position: [0.0, 0.0, -0.01]
    color: [0.6, 0.6, 0.6, 0.8]
  - id: wall
    size: [0.02, 1.0, 1.0]
    position: [0.4, 0.0, 0.5]
    color: [0.8, 0.2, 0.2, 0.6]
  # - id: block
  #   size: [0.075, 0.075, 0.075]
  #   position: [-0.15, 0.15, 0.7]
  #   color: [0.8, 0.8, 0.1, 0.6]

# What to record and where. bag_uri is a base path; the launch appends a
# timestamp so every run gets a unique bag directory.
recording:
  bag_uri: runs/drawer
  topics:
    - /joint_states
    - /tf
    - /tf_static
    - /robot_description
    - /zed/zed_node/depth/depth_registered
